services:
  postgres:
    image: postgres:18@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4
    environment:
      POSTGRES_DB: nutrition
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nutrition-postgres-data:/var/lib/postgresql
      - ../migrations:/migrations:ro

volumes:
  nutrition-postgres-data:
