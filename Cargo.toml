[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/persistence-postgres",
    "crates/api-http",
    "crates/worker",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
domain = { path = "crates/domain" }
application = { path = "crates/application" }
adapters = { path = "crates/adapters" }
persistence-postgres = { path = "crates/persistence-postgres" }
hex = "0.4"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "rust_decimal", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
