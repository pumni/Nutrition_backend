name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Verify required tools
        run: |
          pwsh --version
          docker --version
          docker compose version

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run Cargo.lock vulnerability audit
        run: cargo audit
      - name: Verify ignored rkyv advisory remains unreachable
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --workspace --all-features --edges normal --invert rkyv)"
          if [[ -n "$tree" ]]; then
            echo "rkyv is reachable through enabled workspace features; revisit RUSTSEC-2026-0235" >&2
            printf '%s\n' "$tree" >&2
            exit 1
          fi


      - name: Run normal repository check
        run: cargo xtask check

      - name: Run PostgreSQL integration verification
        run: cargo xtask postgres

      - name: Run staged FDC verification
        run: cargo xtask fdc

      - name: Run production container verification
        run: cargo xtask containers

      - name: Clean verification resources
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.container-smoke.yaml down -v --remove-orphans
