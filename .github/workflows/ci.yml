name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Verify required tools
        run: |
          pwsh --version
          docker --version
          docker compose version

      - name: Run normal repository check
        run: cargo xtask check

      - name: Run PostgreSQL integration verification
        run: cargo xtask postgres

      - name: Run staged FDC verification
        run: cargo xtask fdc

      - name: Run production container verification
        run: cargo xtask containers

      - name: Clean verification resources
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.container-smoke.yaml down -v --remove-orphans
