name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Verify PowerShell and Docker
        run: |
          pwsh --version
          docker --version
          docker compose version

      - name: Run foundation verification
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Run PostgreSQL integration verification
        shell: pwsh
        run: ./scripts/verify-postgres.ps1

      - name: Clean PostgreSQL verification resources
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans

      - name: Run production container verification
        shell: pwsh
        run: ./scripts/verify-containers.ps1
