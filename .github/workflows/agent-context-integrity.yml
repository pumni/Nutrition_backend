name: Agent Context Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - shell: pwsh
        run: ./scripts/verify-agent-context.ps1 -SelfTest
      - shell: pwsh
        run: ./scripts/run-agent-verification.ps1 -SelfTest
      - shell: pwsh
        run: ./scripts/verify-agent-context.ps1 -CiPolicy
      - shell: pwsh
        run: ./scripts/verify-agent-facts.ps1 -Check
      - shell: pwsh
        run: ./scripts/verify-agent-context.ps1
